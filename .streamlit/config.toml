# Streamlit local-run configuration.
# This file is safe to commit — secrets must stay in .streamlit/secrets.toml
# which is already listed in .gitignore.

[server]
# Keep the default port so the URL matches the instructions in README.md.
port = 8501
# When running locally, let Streamlit open the browser automatically.
# Streamlit Community Cloud ignores this setting.
headless = false

[browser]
# Disable usage-statistics collection when developing locally.
gatherUsageStats = false

[runner]
# Raise an error for unsafe HTML instead of silently swallowing it, so
# issues surface during local development before Cloud deploy.
fastReruns = true
